<div class="np-pwa-shell" [class.np-pwa-shell--bare]="bare()">
  @if (!bare()) {
    <app-pwa-header />
  }
  <main class="np-pwa-main" id="contenu">
    <router-outlet />
    @if (!bare()) {
      <p class="np-disclaimer-compact">
        Analyse informative, fondée sur les recommandations officielles. Elle ne remplace pas
        l'avis d'un pédiatre. <a routerLink="/infos">Comment on note</a>
      </p>
    }
  </main>
  @if (!bare()) {
    <app-pwa-bottom-nav />
  }
</div>
