<div class="np-pwa-shell" [class.np-pwa-shell--bare]="bare()">
  @if (!bare()) {
    <app-pwa-header />
  }
  <main class="np-pwa-main" id="contenu">
    <router-outlet />
    @if (!bare()) {
      <p class="np-disclaimer-compact">
        NutriPetit n'est pas un professionnel de santé et ne donne aucun avis médical. Pour toute
        question sur l'alimentation de votre enfant, demandez à votre médecin ou à votre pédiatre.
        <a routerLink="/infos">Comment on note&#160;?</a>
      </p>
    }
  </main>
  @if (!bare()) {
    <app-pwa-bottom-nav />
  }
</div>
