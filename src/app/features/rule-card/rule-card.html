<article [class]="'rc rc--' + rule.category">
  <span [class]="'rc__mark rc__mark--' + rule.category" aria-hidden="true">
    <app-icon [name]="iconName()" class="rc__icon" />
  </span>
  <div class="rc__main">
    <div class="rc__top">
      <h4 class="rc__label">{{ rule.rule_label }}</h4>
      @if (rule.status !== 'satisfied' && rule.points !== 0) {
        <span [class]="'rc__pts rc__pts--' + (rule.points < 0 ? 'minus' : 'plus')">
          {{ rule.points > 0 ? '+' : '' }}{{ rule.points }}
        </span>
      }
    </div>
    <p class="rc__reason">{{ rule.reason }}</p>
    @if (rule.source_url) {
      <a [href]="rule.source_url" target="_blank" rel="noopener noreferrer" class="rc__source">
        {{ rule.source_name }}
      </a>
    }
  </div>
</article>
