<div class="me">
  <header class="me__intro">
    <h1>Saisir le code-barres</h1>
    <p class="me__lead">Le code est abîmé ou la caméra ne marche pas&#160;? Tapez les chiffres écrits sous les barres.</p>
  </header>

  <form class="me__form" (ngSubmit)="submit()" novalidate>
    <label for="ean-input" class="me__label">Code-barres</label>
    <input
      id="ean-input"
      name="ean"
      type="text"
      inputmode="numeric"
      autocomplete="off"
      maxlength="20"
      class="me__input"
      [class.me__input--error]="touched() && error()"
      [attr.aria-invalid]="touched() && error() ? 'true' : null"
      aria-describedby="ean-hint ean-error"
      [ngModel]="ean()"
      (ngModelChange)="onInput($event)"
      (blur)="ean() !== '' && touched.set(true)"
    />
    <p id="ean-hint" class="me__hint">8 ou 13 chiffres le plus souvent. Les espaces ne comptent pas.</p>
    <p id="ean-error" class="me__error" aria-live="polite">
      @if (touched() && error(); as e) {
        {{ e }}
      }
    </p>
    <button type="submit" class="np-cta">Voir le score</button>
  </form>

  <a routerLink="/scanner" class="me__alt">Scanner plutôt avec la caméra</a>
</div>
